name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt ruff==0.16.10
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit, UI (AppTest) and HTTP integration tests
        run: python -m pytest -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit==2.10.0
          pip-audit -r requirements.txt -r requirements-dev.txt --progress-spinner off

  docker:
    name: Docker build and health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up --build -d
      - name: Wait for healthy container
        run: |
          cid=$(docker compose ps -q observatory)
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$cid")
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
      - name: HTTP smoke checks
        run: |
          for path in / /_stcore/health /favicon.png "/?scenario=emergency&t=186"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept-Encoding: gzip' "http://localhost:8501$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || exit 1
          done
      - name: Tests inside the container
        run: docker compose exec -T observatory python -m pytest -q -p no:cacheprovider
      - name: No unexplained server errors
        run: |
          docker compose logs observatory > server.log
          if grep -E "Traceback|Exception in ASGI" server.log; then cat server.log; exit 1; fi
      - name: Stop
        if: always()
        run: docker compose down
