services:
  observatory:
    build: .
    image: ai-infrastructure-observatory:1.0
    ports:
      - "8501:8501"
    read_only: true
    tmpfs:
      - /tmp
      - /home/observatory:uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
