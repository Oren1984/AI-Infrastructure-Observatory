    publication_date: "2024-07-12"
    effective_date: "2024-08-01 entry into force; staged application 2025–2027"
    domain: ai_service
    legal_status: binding
    scope: "Obligations depend on role (provider/deployer) and risk classification of the AI system."
    applicability: unknown
    related_control: CTL-AI-04
    evidence_expected: "Role and risk classification record; documentation; human oversight arrangements where applicable."
    uncertainty: "A general chat service is not classified here; amendments after the published text were not checked."
  # ----------------------------------------------------------------- IE
  - id: GOV-IE-01
    jurisdiction: IE
    level: national
    issuing_authority: "Commission for Regulation of Utilities"
    instrument: "Large Energy Users Connection Policy decision (CRU2025236); direction to System Operators under s.34 Electricity Regulation Act 1999"
    source_id: ie-cru-leu-2025
    section: "Sections 3.3–3.5 (requirements by MIC; renewable electricity requirement)"
    publication_date: "2025-12-12"
    effective_date: "Applies to new connection applications for new or additional capacity; supersedes Direction CRU/21/124"
    domain: facility
    legal_status: binding
    scope: "Data centres ≥ 10 MVA must provide dispatchable onsite or proximate generation and/or storage matching their MIC (de-rated); ≥ 1 MVA must meet ≥ 80% of annual demand with additional Irish renewable electricity on a 6-year glide path."
    applicability: applies
    related_control: CTL-GRID-05
    evidence_expected: "Connection agreement; de-rated dispatchable capacity records; renewable electricity matching evidence."
    uncertainty: "Read from the official decision paper; detailed de-rating rules and transitional provisions not modelled. The reference configuration (24 MW dispatchable vs 34 MW connection) is shown as a demonstration gap (CHK-09), not a verdict."
