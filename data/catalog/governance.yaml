# Governance and evidence catalog.
#
# Jurisdictions are configuration-driven: add one under `jurisdictions` and
# give it entries (or an explicit gap entry). Results shown in the app are
# DEMONSTRATION EVIDENCE produced by a simulation. They are not a compliance
# verdict for any real facility or service.
catalog_version: "2026-11-10"

jurisdictions:
  - {code: EU, name: "European Union", initial: true,  relation: "Applies to the reference facility (EU member state)"}
  - {code: US, name: "United States",  initial: true,  relation: "Comparison jurisdiction"}
  - {code: AU, name: "Australia",      initial: true,  relation: "Comparison jurisdiction"}
  - {code: JP, name: "Japan",          initial: true,  relation: "Comparison jurisdiction"}
  - {code: IL, name: "Israel",         initial: true,  relation: "Comparison jurisdiction"}
  - {code: IE, name: "Ireland",        initial: false, relation: "Location of the reference facility (added by configuration)"}

controls:
  - {id: CTL-EN-01,   title: "Energy and water KPI reporting",           demonstration: "PUE, WUE and energy totals computed per run with formula and inputs (Cost & governance tab)."}
  - {id: CTL-AIR-02,  title: "Backup generator hours and emissions",      demonstration: "Generator run time, fuel, CO₂ and NOx estimate per run (Cooling, environment & community tab)."}
  - {id: CTL-SEC-03,  title: "Cybersecurity risk management",            demonstration: "Simulated control checks and alert feed (Security & observability tab)."}
  - {id: CTL-AI-04,   title: "AI service oversight and accountability",   demonstration: "Decision log tying each shed/route/restore to owner, policy and event evidence."}
  - {id: CTL-GRID-05, title: "Grid connection conditions and instructions", demonstration: "Demand-reduction instruction handling and on-site dispatchable capacity."}
  - {id: CTL-PRIV-06, title: "Privacy by design in operational logs",     demonstration: "Event schema has no prompt, credential or user-identifier fields."}

policies:
  - {id: POL-LS-01, title: "Load-shedding priority",                  control: CTL-GRID-05, owner: "Facility shift lead"}
  - {id: POL-RC-02, title: "Staged recovery",                         control: CTL-AI-04,   owner: "Facility shift lead"}
  - {id: POL-SV-03, title: "Model routing under constraint",          control: CTL-AI-04,   owner: "SRE on call"}
  - {id: POL-EM-04, title: "Islanding and backup dispatch",           control: CTL-AIR-02,  owner: "Electrical duty engineer"}
  - {id: POL-EM-05, title: "Controlled shutdown",                     control: CTL-AI-04,   owner: "Incident commander"}
  - {id: POL-DR-06, title: "Grid operator instructions",              control: CTL-GRID-05, owner: "Energy desk"}

entries:
  # ----------------------------------------------------------------- EU
  - id: GOV-EU-01
    jurisdiction: EU
    level: supranational
    issuing_authority: "European Parliament and Council"
    instrument: "Directive (EU) 2023/1791 (Energy Efficiency Directive, recast)"
    source_id: eu-2023-1791
    section: "Article 12(1)"
    publication_date: "2023-09-20"
    effective_date: "2024-05-15 (first reporting date)"
    domain: facility
    legal_status: binding
    scope: "Member States require owners/operators of data centres with installed IT power demand ≥ 500 kW to make information public and report annually."
    applicability: applies
    related_control: CTL-EN-01
    evidence_expected: "Annual energy, water and KPI report via the national scheme."
    uncertainty: "Obligation reaches operators through national transposition; Irish transposition not checked."
  - id: GOV-EU-02
    jurisdiction: EU
    level: supranational
    issuing_authority: "European Commission"
    instrument: "Delegated Regulation (EU) 2024/1364 (data centre rating scheme, first phase)"
    source_id: eu-2024-1364
    section: "Article 3; Annex I–III"
    publication_date: "2024-05-17"
    effective_date: "2024-09-15 (first reporting); then 15 May annually"
    domain: facility
    legal_status: binding
    scope: "Reporting of information and KPIs to the European database; sustainability indicators PUE, WUE, ERF, REF."
    applicability: applies
    related_control: CTL-EN-01
    evidence_expected: "KPI dataset with E_DC, E_IT, W_IN, renewable energy inputs."
    uncertainty: "Simulation covers a 4-hour window, not an annual reporting period."
  - id: GOV-EU-03
    jurisdiction: EU
    level: supranational
    issuing_authority: "European Parliament and Council"
    instrument: "Directive (EU) 2015/2193 (Medium Combustion Plant Directive)"
    source_id: eu-2015-2193
    section: "Article 2(1); Article 6 (limited operating hours exemption)"
    publication_date: "2015-11-28"
    effective_date: "Per national transposition"
    domain: facility
    legal_status: binding
    scope: "Combustion plants 1–50 MW rated thermal input; exemption from emission limit values below 500 operating hours per year (rolling average)."
    applicability: may_apply
    related_control: CTL-AIR-02
    evidence_expected: "Generator registration/permit, operating-hour log, emissions monitoring."
    uncertainty: "Whether generator sets are aggregated into one plant, and Irish permitting route, not determined."
  - id: GOV-EU-04
    jurisdiction: EU
    level: supranational
    issuing_authority: "European Parliament and Council"
    instrument: "Directive (EU) 2022/2555 (NIS 2)"
    source_id: eu-2022-2555
    section: "Article 21; Annex I (digital infrastructure)"
    publication_date: "2022-12-27"
    effective_date: "2024-10-18 (application of national measures)"
    domain: ai_service
    legal_status: binding
    scope: "Cybersecurity risk-management measures for essential and important entities, including data centre service providers."
    applicability: may_apply
    related_control: CTL-SEC-03
    evidence_expected: "Risk-management measures, incident handling, business continuity and backup management."
    uncertainty: "Entity classification depends on size and national transposition; not determined for a fictional operator."
  - id: GOV-EU-05
    jurisdiction: EU
    level: supranational
    issuing_authority: "European Parliament and Council"
